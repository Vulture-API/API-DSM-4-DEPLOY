name: Continuous Deployment (AWS EC2)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino na AWS
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
      skip_smoke_test:
        description: Pular smoke test externo apos o deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: aws-production-deployment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  pre-flight:
    name: Validacao de Pre-requisitos AWS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ssm_configured: ${{ steps.check.outputs.ssm_configured }}
      ssh_configured: ${{ steps.check.outputs.ssh_configured }}
      external_smoke_configured: ${{ steps.check.outputs.external_smoke_configured }}
    steps:
      - name: Verificar secrets e modo de deploy configurado
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_FRONT_URL: ${{ secrets.PROD_FRONT_URL }}
        run: |
          SSM_READY="false"
          SSH_READY="false"
          SMOKE_READY="false"

          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$AWS_EC2_INSTANCE_ID" ]; then
            SSM_READY="true"
            echo "Modo selecionado: AWS OIDC + Systems Manager (SSM Run Command)."
          elif [ -n "$EC2_SSH_HOST" ] && [ -n "$EC2_SSH_PRIVATE_KEY" ]; then
            SSH_READY="true"
            echo "Modo selecionado: Fallback via SSH direto na EC2."
          else
            echo "::notice::Credenciais AWS ainda nao configuradas nos Secrets do repositorio API-DSM-4-DEPLOY. Configure AWS_ROLE_ARN e AWS_EC2_INSTANCE_ID (recomendado via OIDC/SSM) ou EC2_SSH_HOST e EC2_SSH_PRIVATE_KEY (fallback SSH)."
          fi

          if [ -n "$PROD_API_URL" ] || [ -n "$PROD_FRONT_URL" ]; then
            SMOKE_READY="true"
          fi

          echo "ssm_configured=${SSM_READY}" >> "$GITHUB_OUTPUT"
          echo "ssh_configured=${SSH_READY}" >> "$GITHUB_OUTPUT"
          echo "external_smoke_configured=${SMOKE_READY}" >> "$GITHUB_OUTPUT"

  deploy-ec2-ssm:
    name: Deploy EC2 via AWS SSM (OIDC)
    needs: pre-flight
    if: ${{ !cancelled() && needs.pre-flight.outputs.ssm_configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-VultureDeploy

      - name: Disparar deploy na EC2 via AWS SSM Run Command
        id: send_ssm
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          echo "Enviando comando de deploy para a instancia ${INSTANCE_ID} (ambiente: ${TARGET_ENV})..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions API-DSM-4-DEPLOY (${GITHUB_SHA::7})" \
            --timeout-seconds 900 \
            --parameters 'commands=["sudo /opt/vulture/scripts/deploy-ec2.sh"]' \
            --query "Command.CommandId" \
            --output text)
          echo "CommandId: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Aguardar execucao e coletar logs do SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send_ssm.outputs.command_id }}
        run: |
          echo "Aguardando conclusao do comando ${COMMAND_ID}..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

          INVOCATION_JSON=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --output json)

          STATUS=$(echo "${INVOCATION_JSON}" | jq -r '.Status')
          RESPONSE_CODE=$(echo "${INVOCATION_JSON}" | jq -r '.ResponseCode')

          echo "=== Saida Padrao (EC2) ==="
          echo "${INVOCATION_JSON}" | jq -r '.StandardOutputContent // ""'

          STDERR_OUT=$(echo "${INVOCATION_JSON}" | jq -r '.StandardErrorContent // ""')
          if [ -n "${STDERR_OUT}" ]; then
            echo "=== Saida de Erro (EC2) ==="
            echo "${STDERR_OUT}"
          fi

          echo "Status SSM: ${STATUS} (codigo de saida: ${RESPONSE_CODE})"
          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Falha no deploy via SSM (status: ${STATUS}, exit code: ${RESPONSE_CODE})."
            exit 1
          fi

  deploy-ec2-ssh:
    name: Deploy EC2 via SSH (Alternativo)
    needs: pre-flight
    if: ${{ !cancelled() && needs.pre-flight.outputs.ssm_configured != 'true' && needs.pre-flight.outputs.ssh_configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Executar script de deploy na EC2 via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            STRICT_OPT="-o StrictHostKeyChecking=yes"
          else
            STRICT_OPT="-o StrictHostKeyChecking=accept-new"
          fi

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" ${STRICT_OPT} \
            "${SSH_USER}@${SSH_HOST}" \
            "sudo /opt/vulture/scripts/deploy-ec2.sh"

  smoke-test-external:
    name: Smoke Test Externo Pos-Deploy
    needs: [pre-flight, deploy-ec2-ssm, deploy-ec2-ssh]
    if: >-
      !cancelled() &&
      (needs.deploy-ec2-ssm.result == 'success' || needs.deploy-ec2-ssh.result == 'success') &&
      needs.pre-flight.outputs.external_smoke_configured == 'true' &&
      inputs.skip_smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar URLs publicas em producao
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_FRONT_URL: ${{ secrets.PROD_FRONT_URL }}
        run: |
          check_url() {
            local label="$1"
            local url="$2"
            local max_code="$3"
            local status="000"

            for attempt in $(seq 1 10); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "${url}" || true)
              if [ "${status}" -ge 200 ] && [ "${status}" -lt "${max_code}" ]; then
                echo "[OK] ${label} (${url}) -> HTTP ${status} (tentativa ${attempt})."
                return 0
              fi
              echo "[Aguardando] ${label} -> HTTP ${status} (tentativa ${attempt}/10)..."
              sleep 10
            done

            echo "::error::Falha no Smoke Test externo de ${label} (${url}): HTTP ${status}."
            return 1
          }

          if [ -n "${PROD_API_URL}" ]; then
            check_url "API /health" "${PROD_API_URL%/}/health" 300
          fi

          if [ -n "${PROD_FRONT_URL}" ]; then
            check_url "Portal Web" "${PROD_FRONT_URL}" 500
          fi
