AWSTemplateFormatVersion: "2010-09-09"
Description: Vulture Agritech - EC2 Docker Compose Stack with GitHub OIDC and SSM Deploy

Parameters:
  EnvironmentName:
    Type: String
    Default: vulture-prod
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefix used to name and tag AWS resources (lowercase letters, numbers, and hyphens).

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type (t3.small recommended for Next.js + Node + Python builds; t3.micro works with 2 GB swap).

  GitHubOrg:
    Type: String
    Default: Vulture-API
    Description: GitHub organization or user name allowed to assume the OIDC deploy role.

  GitHubDeployRepo:
    Type: String
    Default: API-DSM-4-DEPLOY
    Description: Dedicated deploy repository name in GitHub allowed to assume the OIDC deploy role.

  AllowedMqttCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block allowed to publish MQTT telemetry on TCP port 1883 (restrict to station IPs when possible).

  CreateGitHubOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to false if the AWS account already has an IAM OIDC provider for token.actions.githubusercontent.com.

  AllocateElasticIp:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Allocate and associate an Elastic IP to keep the public IPv4 address fixed across restarts.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS AMI ID resolved automatically via SSM Parameter Store.

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateGitHubOIDCProvider, "true"]
  ShouldAllocateEIP: !Equals [!Ref AllocateElasticIp, "true"]

Resources:
  VultureEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-ec2-sg"
      GroupDescription: Vulture EC2 security group - HTTP, HTTPS, and MQTT only (no SSH port 22)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP access routed to Nginx reverse proxy
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Public HTTPS access for TLS termination or Cloudflare proxy
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          CidrIp: !Ref AllowedMqttCidr
          Description: MQTT telemetry ingestion port for weather stations
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ec2-sg"
        - Key: Project
          Value: vulture
        - Key: Environment
          Value: production

  VultureEC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ec2-role"
      Description: IAM role for Vulture EC2 instance with SSM Session Manager and Parameter Store read access
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: !Sub "${EnvironmentName}-ssm-parameters-read"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadVultureParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vulture/${EnvironmentName}/*"
              - Sid: DecryptSecureParameters
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Project
          Value: vulture
        - Key: Environment
          Value: production

  VultureEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-ec2-profile"
      Roles:
        - !Ref VultureEC2InstanceRole

  VultureEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref VultureEC2InstanceProfile
      SecurityGroupIds:
        - !GetAtt VultureEC2SecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app"
        - Key: Project
          Value: vulture
        - Key: Environment
          Value: production

  VultureEC2ElasticIp:
    Type: AWS::EC2::EIP
    Condition: ShouldAllocateEIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-eip"
        - Key: Project
          Value: vulture
        - Key: Environment
          Value: production

  VultureEC2EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: ShouldAllocateEIP
    Properties:
      InstanceId: !Ref VultureEC2Instance
      AllocationId: !GetAtt VultureEC2ElasticIp.AllocationId

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Project
          Value: vulture

  GitHubActionsOIDCRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-github-actions-deploy-role"
      Description: IAM role assumed by GitHub Actions in the dedicated deploy repo via OIDC to execute SSM commands on Vulture EC2
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsOIDCTrust
            Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubDeployRepo}:*"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubDeployRepo}@*:*"
      Policies:
        - PolicyName: !Sub "${EnvironmentName}-ssm-deploy-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendSSMCommandToVultureEC2
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: vulture
              - Sid: AllowRunShellScriptDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadSSMCommandStatusAndDescribeInstances
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ec2:DescribeInstances
                Resource: "*"
      Tags:
        - Key: Project
          Value: vulture
        - Key: Environment
          Value: production

Outputs:
  InstanceId:
    Description: EC2 Instance ID to register as AWS_EC2_INSTANCE_ID secret in GitHub
    Value: !Ref VultureEC2Instance

  PublicIp:
    Description: Public IPv4 address of the EC2 instance (Elastic IP if enabled)
    Value: !If
      - ShouldAllocateEIP
      - !Ref VultureEC2ElasticIp
      - !GetAtt VultureEC2Instance.PublicIp

  PublicDnsName:
    Description: Public DNS hostname of the EC2 instance
    Value: !GetAtt VultureEC2Instance.PublicDnsName

  GitHubActionsRoleArn:
    Description: IAM Role ARN to register as AWS_ROLE_ARN secret in GitHub
    Value: !GetAtt GitHubActionsOIDCRole.Arn
