events {
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        zone frontend 64k;
        server frontend:3010 resolve;
        keepalive 32;
    }

    # Health do backend exposto so em /health (smoke test externo do deploy).
    upstream backend {
        zone backend 64k;
        server backend:3000 resolve;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        location = /dashboard {
            if ($remote_addr = 127.0.0.1) {
                proxy_pass http://frontend;
            }
            return 301 https://__PUBLIC_DOMAIN__$request_uri;
        }

        location / {
            return 301 https://__PUBLIC_DOMAIN__$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name __PUBLIC_DOMAIN__;

        ssl_certificate /etc/letsencrypt/live/__PUBLIC_DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_DOMAIN__/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
